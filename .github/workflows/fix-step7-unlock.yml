name: Fix Step 7 Default SFTP Unlock

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Step 7 unlock fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('admin_panel/views.py')
          text = path.read_text(encoding='utf-8')
          old = """        is_done = st == 'COMPLETED'\n        \n        # Override Step 12 completion based on Go-Live steps\n"""
          new = """        is_done = st == 'COMPLETED'\n\n        # Step 7 can be completed by selecting the admin-managed default SFTP\n        # configuration. Treat that persisted configuration as completion even\n        # if an older frontend did not call the generic step completion endpoint.\n        if step.step_number == 7 and not is_done:\n            from edi835.models import SFTPConfig\n            is_done = SFTPConfig.objects.filter(\n                client=client_obj,\n                connection_type='UNIFIED',\n                use_default=True,\n            ).exists()\n\n        # Override Step 12 completion based on Go-Live steps\n"""
          if old not in text:
              raise SystemExit('Target Step 7 state block was not found; no changes made.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_panel/views.py
          git commit -m "Fix Step 7 default SFTP unlock"
          git push

# Trigger a fresh run after deployment
