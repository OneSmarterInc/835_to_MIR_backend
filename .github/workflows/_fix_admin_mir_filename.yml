name: Fix admin MIR filenames

on:
  push:
    paths:
      - '.github/workflows/_fix_admin_mir_filename.yml'
      - 'README.md'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin MIR filename handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin_panel/views.py')
          s = p.read_text()
          helper = '''\n\ndef _canonical_mir_filename(record):\n    if not record:\n        return ""\n    mir_record = getattr(record, "mir_file", None)\n    if mir_record and mir_record.mir_filename:\n        return Path(mir_record.mir_filename).name\n    return ""\n\ndef _safe_mir_filename(value, fallback="output.mir"):\n    filename = Path(str(value or "").strip()).name\n    if not filename:\n        filename = fallback\n    if not filename.lower().endswith(".mir"):\n        filename += ".mir"\n    return filename\n'''
          marker = '\ndef api_admin_stats(request):'
          if '_canonical_mir_filename' not in s:
              s = s.replace(marker, helper + marker, 1)
          s = s.replace('files = EDI835File.objects.filter(client_id=client_id).order_by(\'-uploaded_at\')', 'files = EDI835File.objects.filter(client_id=client_id).select_related("mir_file").order_by(\'-uploaded_at\')', 1)
          s = s.replace('''            "original_filename": f.original_filename,\n            "status": f.status,''', '''            "original_filename": f.original_filename,\n            "stored_filename": f.stored_filename,\n            "mir_filename": _canonical_mir_filename(f),\n            "output_filename": _canonical_mir_filename(f),\n            "combined_filename": _canonical_mir_filename(f),\n            "status": f.status,''', 1)
          s = s.replace('''        filename = os.path.basename(relative_path)\n\n    else:''', '''        filename = _safe_mir_filename(_canonical_mir_filename(file_record) or os.path.basename(relative_path))\n\n    else:''', 1)
          s = s.replace('mir_filename = Path(db_record.output_path).name if db_record.output_path else "Generated MIR file"', 'mir_filename = _canonical_mir_filename(db_record) or (Path(db_record.output_path).name if db_record.output_path else "Generated MIR file")', 1)
          p.write_text(s)
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_panel/views.py
          git commit -m "Fix admin MIR filename display and downloads" || true
          git rm .github/workflows/_fix_admin_mir_filename.yml
          git commit -m "Remove temporary MIR filename fix workflow"
          git push
