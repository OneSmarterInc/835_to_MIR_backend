# Install as /etc/systemd/system/mir.service.d/workers.conf.
# Preserve the existing ExecStart, including its bind/socket, timeout and logs.
# If GUNICORN_CMD_ARGS is already configured, merge --workers 2 into that value.
# An explicit --workers in ExecStart takes precedence; edit only that option.
[Service]
Environment="GUNICORN_CMD_ARGS=--workers 2"
